<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>PONS</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff}main{max-width:1000px;margin:auto}video{display:block;width:100%;height:auto;max-height:100svh;object-fit:contain;background:#000;margin:0 0 16px}section{margin:0;padding:0}</style></head><body><main><video id="adaptation" controls playsinline preload="metadata" data-rate="1" src="behavior.mp4#t=0" aria-label="Behavioral virtual reality setup"></video><video id="brain-tail" controls playsinline preload="metadata" data-rate="1" src="imaging.mp4#t=0" aria-label="Two-photon imaging coupled with virtual reality"></video></main><script>document.querySelectorAll('video').forEach(v=>{v.addEventListener('loadedmetadata',()=>{v.currentTime=0;v.defaultPlaybackRate=Number(v.dataset.rate||1);v.playbackRate=v.defaultPlaybackRate},{once:true})});document.addEventListener('play',e=>{if(e.target.tagName==='VIDEO')document.querySelectorAll('video').forEach(v=>{if(v!==e.target)v.pause()})},true);</script></body></html>
